[package]
name = "flc-app"
version = "0.1.5"
edition = "2021"
license = "GPL-3.0-only"
authors = ["蛙创 Studio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
serde_json = "1"
flc-core = { path = "../crates/flc-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
