[package]
name = "flc-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["蛙创 Studio"]

[[bin]]
name = "flc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flc-core = { path = "../flc-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
