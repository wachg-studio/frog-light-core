[package]
name = "flc-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["蛙创 Studio"]

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = "0.3"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
